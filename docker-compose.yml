services:
  fastapi:
    build:
      context: ./backend
    container_name: stormhacks_fastapi
    # Loads the PG* vars (the Tiger Cloud database) and other settings
    # from .env, see .env.example.
    env_file:
      - .env
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    restart: unless-stopped

  # Static 3D room view (no build step). Open http://localhost:8080/room-view/
  frontend:
    image: nginx:1.27-alpine
    container_name: stormhacks_frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - fastapi
    restart: unless-stopped

  # Dashboards and alerts over TimescaleDB. Open http://localhost:3000 (admin / GRAFANA_ADMIN_PASSWORD).
  # Datasource, dashboard and alert rule are provisioned from ./grafana.
  grafana:
    image: grafana/grafana:11.2.0
    container_name: stormhacks_grafana
    env_file:
      - .env
    environment:
      PGSSLMODE: ${PGSSLMODE:-require}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  grafana_data:
