# Fires while any device has a WARNING or CRITICAL issue opened, escalated or
# reminded in the last 2 minutes. Add a contact point (phone app, email, Slack...)
# in Grafana > Alerting > Contact points and route this rule to it.
apiVersion: 1
groups:
  - orgId: 1
    name: room-sentinel
    folder: Room Sentinel
    interval: 1m
    rules:
      - uid: sentinel-active-issues
        title: Room Sentinel issue
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "{{ $labels.device_id }}: {{ $labels.kind }} ({{ $labels.severity }})"
        data:
          - refId: A
            datasourceUid: timescaledb
            relativeTimeRange: {from: 120, to: 0}
            model:
              refId: A
              format: table
              rawQuery: true
              rawSql: |
                SELECT device_id, kind, severity, count(*)::float AS value
                FROM issue_events
                WHERE time > now() - interval '2 minutes'
                  AND event IN ('opened', 'escalated', 'reminder')
                  AND severity IN ('WARNING', 'CRITICAL')
                GROUP BY device_id, kind, severity
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
